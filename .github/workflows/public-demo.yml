name: public research demo

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install research dependencies for scheduled refresh
        if: github.event_name != 'push'
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy matplotlib plotly scikit-learn statsmodels yfinance PyYAML

      - name: Rebuild research outputs from public market data
        if: github.event_name != 'push'
        run: python main.py

      - name: Build static public demo from the immutable snapshot on code pushes
        if: github.event_name == 'push'
        run: python scripts/build_public_demo.py --data-root demo_data --output public_demo/dist

      - name: Validate immutable demo artifacts on code pushes
        if: github.event_name == 'push'
        run: python scripts/validate_research_run.py --root demo_data --report /tmp/demo-validation.json

      - name: Build static public demo from fresh outputs
        if: github.event_name != 'push'
        run: python scripts/build_public_demo.py --data-root . --output public_demo/dist

      - name: Validate fresh research artifacts before publishing
        if: github.event_name != 'push'
        run: python scripts/validate_research_run.py --root . --report /tmp/fresh-validation.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public_demo/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
