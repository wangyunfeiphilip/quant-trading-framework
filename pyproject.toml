[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-trading-framework"
version = "0.1.0"
description = "Research-oriented Python/C++ framework for equity strategies, factor models, derivatives pricing, and hedging."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Quant Trading Framework Contributors" }]
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.12",
  "matplotlib>=3.8",
  "plotly>=5.20",
  "streamlit>=1.36",
  "scikit-learn>=1.4",
  "statsmodels>=0.14",
  "yfinance>=0.2",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "notebook>=7.0"]
institutional = [
  "pyqlib>=0.9",
  "openbb>=4.0",
  "riskfolio-lib>=6.0",
  "alphalens-reloaded>=0.4",
  "edgartools>=3.0",
  "quantstats>=0.0.60",
  "vectorbt>=0.26",
]
brokers = ["moomoo-api>=10.10", "ib-insync>=0.9", "ibapi>=9.81"]
research-io = ["openpyxl>=3.1", "pandas-market-calendars>=5.0", "kaleido>=1.0", "backtrader>=1.9"]
ai-agents = ["tradingagents>=0.7"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
